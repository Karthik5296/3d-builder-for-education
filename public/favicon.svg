:root {
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.5;
  color: #e2e8f0;
  background: #020817;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

* {
  box-sizing: border-box;
}

html, body, #root {
  margin: 0;
  min-height: 100%;
  height: 100%;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top, rgba(59, 130, 246, 0.2), transparent 40%), #020817;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.app-shell {
  display: grid;
  grid-template-columns: 360px 1fr;
  min-height: 100vh;
}

.sidebar {
  padding: 24px 20px;
  background: rgba(15, 23, 42, 0.9);
  border-right: 1px solid rgba(148, 163, 184, 0.2);
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.sidebar h1,
.sidebar h2,
.sidebar p,
.sidebar ul {
  margin: 0;
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #67e8f9;
  font-size: 11px;
  font-weight: 700;
  margin-bottom: 8px;
}

.sidebar h1 {
  font-size: 2rem;
}

.panel {
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid rgba(148, 163, 184, 0.2);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.panel h2 {
  font-size: 0.95rem;
  color: #cbd5e1;
}

.button-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.tool,
.control-group button,
.toolbar button {
  border: 1px solid rgba(148, 163, 184, 0.3);
  background: rgba(30, 41, 59, 0.9);
  color: #e2e8f0;
  border-radius: 10px;
  padding: 10px 12px;
  transition: all 0.2s ease;
}

.tool:hover,
.control-group button:hover,
.toolbar button:hover {
  border-color: rgba(103, 232, 249, 0.7);
  transform: translateY(-1px);
}

.tool.active {
  background: linear-gradient(135deg, rgba(45, 212, 191, 0.25), rgba(59, 130, 246, 0.25));
  border-color: rgba(94, 234, 212, 0.8);
}

label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 0.9rem;
  color: #cbd5e1;
}

input[type='color'] {
  width: 52px;
  height: 32px;
  border: none;
  background: transparent;
  padding: 0;
}

.label {
  color: #cbd5e1;
}

.control-group {
  display: flex;
  gap: 10px;
}

.lesson-panel ul {
  padding-left: 18px;
  display: grid;
  gap: 8px;
  color: #cbd5e1;
}

.workspace {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(15, 23, 42, 0.72);
  border-bottom: 1px solid rgba(148, 163, 184, 0.2);
  padding: 14px 20px;
  color: #e2e8f0;
}

.viewport {
  flex: 1;
  min-height: 500px;
}

canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
}

@media (max-width: 900px) {
  .app-shell {
    grid-template-columns: 1fr;
  }

  .sidebar {
    border-right: none;
    border-bottom: 1px solid rgba(148, 163, 184, 0.2);
  }
}
